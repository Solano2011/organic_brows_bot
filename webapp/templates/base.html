<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Запись к мастеру</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <!-- ЭКРАН ВЫБОРА УСЛУГИ -->
        <div class="service-selector" id="serviceSelector">
            
            <!-- Шапка без плюсика -->
            <div class="header">
                <h1>Услуги</h1>
            </div>

            <!-- Список карточек -->
            <div class="services-list" id="services-container">
                <div class="service-card" onclick="selectServiceFromMenu('Маникюр')">
                    <img src="/static/img/Manic.jpg" alt="Маникюр" class="service-image">
                    <div class="service-info">
                        <div class="service-name">Маникюр</div>
                        <div class="service-price">от 1500 ₽</div>
                    </div>
                </div>

                <div class="service-card" onclick="selectServiceFromMenu('Педикюр')">
                    <img src="/static/img/Pedic.jpg" alt="Педикюр" class="service-image">
                    <div class="service-info">
                        <div class="service-name">Педикюр</div>
                        <div class="service-price">от 2000 ₽</div>
                    </div>
                </div>

                <div class="service-card" onclick="selectServiceFromMenu('Покрытие гель-лак')">
                    <img src="/static/img/GelLak.jpg" alt="Гель-лак" class="service-image">
                    <div class="service-info">
                        <div class="service-name">Покрытие гель-лак</div>
                        <div class="service-price">от 800 ₽</div>
                    </div>
                </div>

                <div class="service-card" onclick="selectServiceFromMenu('Наращивание ногтей')">
                    <img src="/static/img/Narashivanie.jpg" alt="Наращивание ногтей" class="service-image">
                    <div class="service-info">
                        <div class="service-name">Наращивание ногтей</div>
                        <div class="service-price">от 2500 ₽</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- КНОПКА НАЗАД -->
        <div id="backButtonContainer" style="display: none;">
            <button class="back-btn" onclick="backToMenu()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                Назад
            </button>
        </div>

        <!-- ЗАГОЛОВОК С УСЛУГОЙ (Подготовлен под фоновую картинку) -->
        <div class="service-header" id="mainServiceHeader">
            <!-- Скрытый эмодзи для работы скрипта -->
            <div class="service-icon" id="serviceIcon" style="display: none;">💅</div>
            
            <div class="service-title" id="serviceTitle">Загрузка...</div>
            <div class="service-subtitle">Выберите удобное время</div>
        </div>

        <!-- ВЫБОР ДАТЫ -->
        <div class="section" id="dateSection">
            <div class="section-title">Выберите дату</div>
            <div class="date-scroll" id="dateScroll"></div>
        </div>

        <!-- ВЫБОР ВРЕМЕНИ -->
        <div class="section time-picker" id="timePicker">
            <div class="section-title">Выберите время</div>
            <div class="time-grid" id="timeGrid">
                <div class="time-chip" onclick="selectTime('10:00', this)">10:00</div>
                <div class="time-chip" onclick="selectTime('11:00', this)">11:00</div>
                <div class="time-chip" onclick="selectTime('12:00', this)">12:00</div>
                <div class="time-chip" onclick="selectTime('13:00', this)">13:00</div>
                <div class="time-chip" onclick="selectTime('14:00', this)">14:00</div>
                <div class="time-chip" onclick="selectTime('15:00', this)">15:00</div>
                <div class="time-chip" onclick="selectTime('16:00', this)">16:00</div>
                <div class="time-chip" onclick="selectTime('17:00', this)">17:00</div>
                <div class="time-chip" onclick="selectTime('18:00', this)">18:00</div>
                <div class="time-chip" onclick="selectTime('19:00', this)">19:00</div>
                <div class="time-chip" onclick="selectTime('20:00', this)">20:00</div>
                <div class="time-chip" onclick="selectTime('21:00', this)">21:00</div>
            </div>
        </div>

        <!-- ФОРМА КОНТАКТОВ -->
        <div class="section contact-form" id="contactForm">
            <div class="section-title">Контактные данные</div>

            <div class="form-group">
                <label class="form-label" for="userName">Ваше имя</label>
                <input type="text" id="userName" class="input-field" placeholder="Например, Мария">
            </div>

            <div class="form-group">
                <label class="form-label" for="userPhone">Номер телефона</label>
                <input type="tel" id="userPhone" class="input-field" placeholder="+7 (999) 123-45-67">
            </div>

            <div class="form-group">
                <label class="form-label" for="userComment">Комментарий мастеру</label>
                <textarea id="userComment" class="input-field" placeholder="Напишите пожелания или особые запросы..."></textarea>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
