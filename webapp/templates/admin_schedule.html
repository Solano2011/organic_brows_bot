<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>График работы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="/static/css/style.css?v=8">
    <link rel="stylesheet" href="/static/css/admin.css?v=1">
</head>
<body>
    <div class="container admin-schedule">
        <div class="month-bar">
            <button type="button" id="prevMonth" class="month-nav">‹</button>
            <h1 id="monthTitle">График</h1>
            <button type="button" id="nextMonth" class="month-nav">›</button>
        </div>
        <div class="weekday-row">
            <span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span>Сб</span><span>Вс</span>
        </div>
        <div class="calendar-grid" id="calendar"></div>

        <form class="day-form" id="dayForm" hidden>
            <div class="day-form-title" id="selectedDateLabel"></div>
            <label class="work-toggle">
                <input type="checkbox" id="isWorking" checked>
                Рабочий день
            </label>
            <div id="hoursFields">
                <label class="form-label" for="startTime">Начало</label>
                <input type="time" id="startTime" class="input-field" value="10:00">
                <label class="form-label" for="endTime">Конец</label>
                <input type="time" id="endTime" class="input-field" value="20:00">
            </div>
            <button type="submit" class="save-day">Сохранить</button>
            <p class="save-status" id="saveStatus"></p>
        </form>
    </div>
    <script src="/static/js/admin.js?v=1"></script>
</body>
</html>
